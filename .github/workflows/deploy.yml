name: Deploy Admin

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t arvello-admin:latest .

      - name: Save Docker image
        run: |
          docker save arvello-admin:latest -o arvello-admin.tar
          chmod 644 arvello-admin.tar
          ls -lh arvello-admin.tar

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /home/admin/deploy

      - name: Upload Docker image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "arvello-admin.tar"
          target: "/home/admin/deploy"

      - name: Deploy to Alibaba Cloud
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/deploy

            test -f .env || { echo "Missing /home/admin/deploy/.env; deploy the backend first"; exit 1; }
            test -f docker-compose.yml || { echo "Missing docker-compose.yml; deploy the backend first"; exit 1; }

            docker load -i arvello-admin.tar
            docker compose --env-file .env up -d --no-build arvello-admin

            rm -f arvello-admin.tar
            docker image prune -f

            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
                docker compose ps arvello-admin
                exit 0
              fi
              sleep 5
            done

            docker compose logs --tail=200 arvello-admin
            exit 1
